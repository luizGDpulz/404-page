# Content negotiation: navegadores (text/html) recebem HTML; clientes de API (Accept: application/json) recebem JSON
map $http_accept $err_prefers_json {
    default             0;
    "~*text/html"       0;
    "~*application/json" 1;
}

# Detecta se o tráfego atravessou a Cloudflare (Free substitui corpos 502/504 por tela genérica, mas repassa 503)
map $http_cf_ray $err_behind_cloudflare {
    default             1;
    ""                  0;
}

# Combina borda + formato + código recebido do NPM (X-Error-Code) em chave única de despacho
map "$err_behind_cloudflare:$err_prefers_json:$http_x_error_code" $err_dispatch {
    default             "503";
    "0:0:502"           "502";
    "0:0:503"           "503";
    "0:0:504"           "504";
    "1:0:502"           "592";
    "1:0:503"           "503";
    "1:0:504"           "594";
    "0:1:502"           "582";
    "0:1:503"           "583";
    "0:1:504"           "584";
    "1:1:502"           "572";
    "1:1:503"           "583";
    "1:1:504"           "574";
}

# Porta 80: Catch-all 404 (host wildcard no NPM — imune a spoofing de X-Error-Code)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    error_page 404 /index.html;
    error_page 580 =404 /errors/404.json;

    include /etc/nginx/includes/static-assets.conf;

    location / {
        if ($err_prefers_json = 1) {
            return 580;
        }
        return 404;
    }
}

# Porta 8080: Fallback interno do NPM para upstreams offline/em manutenção (502/503/504)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    error_page 502 /502/index.html;
    error_page 503 /503/index.html;
    error_page 504 /504/index.html;
    error_page 592 =503 /502/index.html;
    error_page 594 =503 /504/index.html;

    error_page 582 =502 /errors/502.json;
    error_page 583 =503 /errors/503.json;
    error_page 584 =504 /errors/504.json;
    error_page 572 =503 /errors/502.json;
    error_page 574 =503 /errors/504.json;

    include /etc/nginx/includes/static-assets.conf;

    location = /502/index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "30" always;
    }

    location = /503/index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "60" always;
    }

    location = /504/index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "15" always;
    }

    location / {
        if ($err_dispatch = "502") { return 502; }
        if ($err_dispatch = "504") { return 504; }
        if ($err_dispatch = "592") { return 592; }
        if ($err_dispatch = "594") { return 594; }
        if ($err_dispatch = "582") { return 582; }
        if ($err_dispatch = "583") { return 583; }
        if ($err_dispatch = "584") { return 584; }
        if ($err_dispatch = "572") { return 572; }
        if ($err_dispatch = "574") { return 574; }
        return 503;
    }
}
