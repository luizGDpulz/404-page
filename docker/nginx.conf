server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Qualquer rota não mapeada retorna status HTTP 404 real renderizando a SPA
    error_page 404 /index.html;

    location = /index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
