location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /favicon.svg {
    expires 7d;
    try_files $uri =404;
}

location = /index.html {
    internal;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location /errors/ {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
